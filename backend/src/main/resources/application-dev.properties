# H2 Persistent File Database Configuration
spring.datasource.url=jdbc:h2:file:./data/enterprise_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB Config (Running locally on host)
spring.data.mongodb.uri=mongodb://localhost:27017/enterprise_db?serverSelectionTimeoutMS=1000&connectTimeoutMS=1000

# Exclude Redis, Elasticsearch, and Mail auto-connections in Dev Mode
# Mail is excluded because no real SMTP credentials are set in dev.
# OTP codes are printed to the backend console instead.
# Remove MailSenderAutoConfiguration from this list when real SMTP is configured.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Mock S3 Settings
aws.s3.bucket-name=mock-s3-bucket

# Real/SMTP Mail Settings -- uncomment and fill these when you have real SMTP credentials
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.connectiontimeout=5000
# spring.mail.properties.mail.smtp.timeout=5000

# Twilio SMS Config
twilio.account.sid=${TWILIO_ACCOUNT_SID:ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
twilio.auth.token=${TWILIO_AUTH_TOKEN:your_auth_token_here}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+1xxxxxxxxxx}
